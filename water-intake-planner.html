<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="premium-v4.css"><title>Daily Hydration Planner | Daily Vitality</title><meta name="description" content="Estimate a practical starting point for daily fluids. Free Daily Vitality wellness tool."><link rel="canonical" href="https://dailyvitality.xyz/water-intake-planner.html"></head><body><header class="v4-header"><a class="v4-brand" href="index.html"><img src="logo.png" alt="">Daily Vitality</a><a href="index.html#tools">← All Tools</a></header><main class="tool-shell"><div class="tool-card"><span class="v4-kicker">FREE WELLNESS TOOL</span><h1>Daily Hydration Planner</h1><p>Estimate a practical starting point for daily fluids.</p><label>Body weight (lb)</label><input id="weight" type="number" min="1"><button onclick="calc()">Estimate</button><div id="result" class="result">Enter your information to begin.</div><p><small>Educational planning tool only. It does not diagnose, treat or replace personalized medical advice.</small></p></div></main><script>function show(x){document.getElementById('result').innerHTML=x}function calc(){let w=+document.getElementById('weight').value;if(!w)return;let oz=Math.round(w*.5);show(`A simple starting estimate is about <b>${oz} fl oz (${(oz*29.5735/1000).toFixed(1)} L)</b> of fluids/day. Needs vary with climate, activity, pregnancy, illness and medical conditions.`)}</script></body></html>
