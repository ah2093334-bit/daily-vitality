<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="premium-v4.css"><title>Free Wellness Habit Tracker | Daily Vitality</title><meta name="description" content="Free private daily wellness habit tracker for water, sleep, movement, produce and screen breaks."><link rel="canonical" href="https://dailyvitality.xyz/wellness-habit-tracker.html"></head><body><header class="v4-header"><a class="v4-brand" href="index.html"><img src="logo.png" alt="">Daily Vitality</a><a href="index.html#tools">← All Tools</a></header><main class="tool-shell"><div class="tool-card"><span class="v4-kicker">FREE • SAVED ON THIS DEVICE</span><h1>Wellness Habit Tracker</h1><p>Check off small habits. Your choices stay in this browser.</p><div id="habits"></div><button onclick="reset()">Reset Today</button><div class="result" id="score"></div></div></main><script>const H=["Drink water regularly","Keep a consistent sleep window","Move or walk","Eat fruits or vegetables","Take screen/eye breaks","Make time to decompress"];let k="dvhabits-"+new Date().toISOString().slice(0,10),s=JSON.parse(localStorage.getItem(k)||"[]"),box=document.getElementById("habits");function draw(){box.innerHTML=H.map((h,i)=>`<label style="display:block;padding:12px"><input type="checkbox" ${s[i]?"checked":""} onchange="toggle(${i})"> ${h}</label>`).join("");document.getElementById("score").textContent=`${s.filter(Boolean).length} of ${H.length} habits checked today.`}function toggle(i){s[i]=!s[i];localStorage.setItem(k,JSON.stringify(s));draw()}function reset(){s=[];localStorage.removeItem(k);draw()}draw()</script></body></html>
