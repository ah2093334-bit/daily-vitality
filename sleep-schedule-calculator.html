<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="premium-v4.css"><title>Sleep Schedule Calculator | Daily Vitality</title><meta name="description" content="Plan a sleep window around your wake-up time. Free Daily Vitality wellness tool."><link rel="canonical" href="https://dailyvitality.xyz/sleep-schedule-calculator.html"></head><body><header class="v4-header"><a class="v4-brand" href="index.html"><img src="logo.png" alt="">Daily Vitality</a><a href="index.html#tools">← All Tools</a></header><main class="tool-shell"><div class="tool-card"><span class="v4-kicker">FREE WELLNESS TOOL</span><h1>Sleep Schedule Calculator</h1><p>Plan a sleep window around your wake-up time.</p><label>Wake-up time</label><input id="wake" type="time" min="1"><button onclick="calc()">Build Schedule</button><div id="result" class="result">Enter your information to begin.</div><p><small>Educational planning tool only. It does not diagnose, treat or replace personalized medical advice.</small></p></div></main><script>function show(x){document.getElementById('result').innerHTML=x}function calc(){let v=document.getElementById('wake').value;if(!v)return;let [h,m]=v.split(':').map(Number);let d=new Date(2000,0,2,h,m);d.setHours(d.getHours()-8);show(`For an 8-hour sleep opportunity, aim to be asleep around <b>${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</b>. Adults vary; consistency matters too.`)}</script></body></html>
