<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="premium-v4.css"><title>Walking & Steps Planner | Daily Vitality</title><meta name="description" content="Create a gradual weekly walking target. Free Daily Vitality wellness tool."><link rel="canonical" href="https://dailyvitality.xyz/steps-walking-planner.html"></head><body><header class="v4-header"><a class="v4-brand" href="index.html"><img src="logo.png" alt="">Daily Vitality</a><a href="index.html#tools">← All Tools</a></header><main class="tool-shell"><div class="tool-card"><span class="v4-kicker">FREE WELLNESS TOOL</span><h1>Walking & Steps Planner</h1><p>Create a gradual weekly walking target.</p><label>Current average steps/day</label><input id="steps" type="number" min="1"><button onclick="calc()">Build Goal</button><div id="result" class="result">Enter your information to begin.</div><p><small>Educational planning tool only. It does not diagnose, treat or replace personalized medical advice.</small></p></div></main><script>function show(x){document.getElementById('result').innerHTML=x}function calc(){let s=+document.getElementById('steps').value;if(!s)return;let n=Math.round(s*1.1/100)*100;show(`A gentle next target could be about <b>${n.toLocaleString()} steps/day</b> — roughly 10% above your current average. Increase gradually and adjust for pain, fatigue and mobility.`)}</script></body></html>
