<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator — Daily Vitality</title><link rel="stylesheet" href="dv-premium-v5.css"></head><body><header class="top"><div class="wrap brandrow"><a class="brand" href="index.html"><img src="logo.png" alt="Daily Vitality logo">Daily Vitality</a></div></header><section class="section"><div class="wrap tool-shell"><aside class="tool-art" style="--a:#0c688f;--b:#16a7a0"><div class="bigicon">⚖️</div><span class="eyebrow">BODY BASICS</span><h1>BMI Calculator</h1><p>Understand BMI with context. Educational only — not diagnosis.</p></aside><div class="tool-panel"><h2>Calculate your BMI</h2><div class="form-grid"><div class="field"><label>Weight (kg)</label><input id="w" type="number" value="70"></div><div class="field"><label>Height (cm)</label><input id="h" type="number" value="170"></div></div><button class="calcbtn" onclick="calc()">Calculate</button><div id="result" class="result"></div></div></div></section><script>function calc(){let w=+document.getElementById('w').value,h=+document.getElementById('h').value/100,b=w/(h*h);let band=b<18.5?'Underweight':b<25?'General healthy range':b<30?'Overweight':'Obesity range';document.getElementById('result').innerHTML='<strong>'+b.toFixed(1)+'</strong><p>'+band+' — BMI is a rough screening tool and does not reflect body composition or medical history.</p>';document.getElementById('result').classList.add('show')}</script><script src="dv-premium-v5.js"></script></body></html>
