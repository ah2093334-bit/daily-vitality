<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="premium-v4.css"><title>Protein Intake Planner | Daily Vitality</title><meta name="description" content="See an educational protein range based on body weight. Free Daily Vitality wellness tool."><link rel="canonical" href="https://dailyvitality.xyz/protein-intake-planner.html"></head><body><header class="v4-header"><a class="v4-brand" href="index.html"><img src="logo.png" alt="">Daily Vitality</a><a href="index.html#tools">← All Tools</a></header><main class="tool-shell"><div class="tool-card"><span class="v4-kicker">FREE WELLNESS TOOL</span><h1>Protein Intake Planner</h1><p>See an educational protein range based on body weight.</p><label>Body weight (lb)</label><input id="weight" type="number" min="1"><button onclick="calc()">Estimate Range</button><div id="result" class="result">Enter your information to begin.</div><p><small>Educational planning tool only. It does not diagnose, treat or replace personalized medical advice.</small></p></div></main><script>function show(x){document.getElementById('result').innerHTML=x}function calc(){let w=+document.getElementById('weight').value;if(!w)return;let kg=w/2.20462;show(`A general adult reference point is about <b>${Math.round(kg*.8)} g/day</b> (0.8 g/kg). Individual needs can be higher with age, activity or specific goals; kidney disease and other conditions require clinician guidance.`)}</script></body></html>
